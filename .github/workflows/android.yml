name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure SDK licenses accepted
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle 8.7
        run: |
          set -x
          ok=0
          for url in \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            https://mirrors.huaweicloud.com/gradle/gradle-8.7-bin.zip \
            https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip ; do
            echo "trying $url"
            curl -fL --retry 3 --retry-delay 5 -o /tmp/gradle.zip "$url" && ok=1 && break
          done
          [ "$ok" = "1" ] || { echo "all gradle mirrors failed"; exit 1; }
          ls -l /tmp/gradle.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/gradle.zip').extractall('/opt')"
          chmod +x /opt/gradle-8.7/bin/gradle
          /opt/gradle-8.7/bin/gradle --version
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: |
          pwd
          ls -la
          ls -la android || echo "NO android dir"
          gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Publish to release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "LibraryApp Debug APK" \
            --notes "浜戠鑷姩鏋勫缓 $GITHUB_SHA" \
            --latest
